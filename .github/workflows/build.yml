name: Build
on:
  pull_request:
    branches:
      - main
  # The upstream merge job opens its pull request with the workflow token, and GitHub deliberately does not
  # fire pull_request workflows for those. Without this the one pull request that most needs a build, a
  # hundred upstream module changes landing at once, would arrive with no build at all.
  push:
    branches:
      - 'upstream/**'

  # Dalamud ships on its own schedule and this plugin compiles against whatever it has shipped, so the build
  # can start failing without a line of this repository changing. Nothing here would notice: the last run was
  # against whatever Dalamud looked like the last time somebody opened a pull request, which during a quiet
  # week can be a fortnight ago and a client update or two behind.
  #
  # A weekly run turns that into a red tick on a morning nobody was expecting one, which is the whole point.
  # It costs a few minutes of a runner and answers the question that otherwise gets asked by a user whose game
  # will not load the plugin.
  schedule:
    - cron: '0 10 * * 1'

  # And on demand, for the morning somebody sees the Dalamud update land and wants the answer now rather than
  # by opening a pull request against main to provoke one.
  workflow_dispatch:

jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          # Retried, because this is one unauthenticated fetch of somebody else's file and it does fail: the
          # sister repository's build died here the same morning this was written, on a connection closed
          # mid-transfer, and reported it as a build failure. That matters more now than it did. A weekly run
          # exists to say "the plugin no longer compiles", and a red tick that actually means "the download
          # blipped" is the fastest way to teach everybody to ignore the weekly run.
          $ErrorActionPreference = 'Stop'
          for ($i = 1; $i -le 5; ++$i) {
            try {
              Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
              break
            } catch {
              if ($i -eq 5) { throw }
              Write-Host "Dalamud download failed ($($_.Exception.Message)), attempt $i of 5"
              Start-Sleep -Seconds (5 * $i)
            }
          }

          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

          # Printed so a failure later in the run can be pinned to a Dalamud version without guessing.
          $version = Invoke-RestMethod -Uri https://goatcorp.github.io/dalamud-distrib/version
          Write-Host "Building against Dalamud $($version.AssemblyVersion)"

      - name: Restore NuGet Packages
        run: dotnet restore     BossMod/BossModReborn.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release BossMod/BossModReborn.csproj

      # Uploads the built plugin folder so a branch can be tested in game before it is tagged and released:
      # download it from the Actions tab, unzip somewhere permanent, and point Dev Plugin Locations at it.
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BossModRewired-${{ github.event.pull_request.head.sha }}
          path: BossMod/bin/Release/
          if-no-files-found: error
