name: Build
on:
  pull_request:
    branches:
      - main
jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore NuGet Packages
        run: dotnet restore     BossMod/BossModReborn.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release BossMod/BossModReborn.csproj

      # Uploads the built plugin folder so a branch can be tested in game before it is tagged and released:
      # download it from the Actions tab, unzip somewhere permanent, and point Dev Plugin Locations at it.
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BossModRewired-${{ github.event.pull_request.head.sha }}
          path: BossMod/bin/Release/
          if-no-files-found: error
