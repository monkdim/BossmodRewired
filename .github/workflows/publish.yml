name: Publish
on:
  push:
    tags:
      - '*.*.*.*'
  # Manual trigger, because a tag push needs a credential with tag-ref write access and not every
  # automation context has one. Dispatching with a version does the same job and creates the tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, four dot-separated numbers, e.g. 1.0.0.0'
        required: true
        type: string
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Get Environment Variables
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            "${{ github.ref }}" -replace 'refs/tags/', ''
          }

          # Dalamud compares four-part assembly versions, so a malformed version has to fail here rather
          # than produce a release nobody can update to.
          if ($tag -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "version '$tag' must be four dot-separated numbers, e.g. 1.0.0.0"
          }

          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore Nuget Packages
        run: dotnet restore BossMod\BossModReborn.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release BossMod\BossModReborn.csproj -p:AssemblyVersion=${{ env.tag }} -p:FileVersion=${{ env.tag }} -p:PackageVersion=${{ env.tag }} -p:InformationalVersion=${{ env.tag }} --output .\build

      - name: Cleanup Build Output
        run: Get-ChildItem .\build\* -Exclude BossModRewired.*,DefaultRotationPresets.json,RebornPresets.json,PInvoke.User32.dll | Remove-Item -Force -Recurse

      - name: Zip Plugin
        run: Compress-Archive -Path .\build\* -DestinationPath .\build\latest.zip

      # Dalamud compares the AssemblyVersion in repo.json against the one baked into the DLL. If they drift,
      # the installer offers an update that immediately reappears, so the mismatch is caught here instead.
      - name: Verify assembly version matches tag
        run: |
          $dll = Get-Item .\build\BossModRewired.dll
          $actual = $dll.VersionInfo.FileVersion
          Write-Host "dll file version: $actual, tag: ${{ env.tag }}"
          if ($actual -ne '${{ env.tag }}') {
            throw "built assembly version $actual does not match tag ${{ env.tag }}"
          }

      # Generated after the zip so it is not packaged inside it. This is the file Dalamud reads when the
      # repository URL is added under Custom Plugin Repositories, so it has to be a flat JSON array of
      # plugin entries, and the download links have to keep working across future releases.
      - name: Generate repo.json
        run: |
          $manifest = Get-Content BossMod\BossModRewired.json -Raw | ConvertFrom-Json

          # The /releases/latest/download/ redirect always resolves to the newest release, which is what makes
          # the repository URL permanent. Pinning this tag would freeze everyone on this version forever.
          $download = "https://github.com/${{ github.repository }}/releases/latest/download/latest.zip"

          $manifest | Add-Member -NotePropertyName AssemblyVersion     -NotePropertyValue "${{ env.tag }}" -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue $download -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkUpdate  -NotePropertyValue $download -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkTesting -NotePropertyValue $download -Force
          $manifest | Add-Member -NotePropertyName IsHide              -NotePropertyValue $false -Force
          $manifest | Add-Member -NotePropertyName DownloadCount       -NotePropertyValue 0 -Force

          # Piping the single entry with -AsArray produces [{...}]. Wrapping it in @() first and passing that
          # as -InputObject produces [[{...}]] instead, which Dalamud accepts and then silently ignores.
          $manifest | ConvertTo-Json -Depth 10 -AsArray | Out-File -Encoding utf8 .\build\repo.json

      - name: Validate repo.json
        run: |
          # -NoEnumerate matters: without it ConvertFrom-Json unrolls a one-element array through the pipeline
          # and the array check below rejects output that was actually correct.
          $parsed = Get-Content .\build\repo.json -Raw | ConvertFrom-Json -NoEnumerate

          if ($parsed -isnot [System.Collections.IList]) {
            throw "repo.json is not a JSON array"
          }
          if ($parsed.Count -ne 1) {
            throw "expected exactly one plugin entry, got $($parsed.Count)"
          }
          if ($parsed[0].InternalName -ne 'BossModRewired') {
            throw "unexpected InternalName: $($parsed[0].InternalName)"
          }
          if ($parsed[0].AssemblyVersion -ne '${{ env.tag }}') {
            throw "AssemblyVersion $($parsed[0].AssemblyVersion) does not match tag ${{ env.tag }}"
          }

          # An IconUrl that 404s produces the same placeholder question mark as having no icon at all, and
          # nothing else would catch it: the manifest is still valid JSON and the release still publishes.
          $icon = $parsed[0].IconUrl
          if ($icon) {
            $ok = $false
            foreach ($attempt in 1..3) {
              try {
                $resp = Invoke-WebRequest -Uri $icon -Method Head -UseBasicParsing
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch {
                Write-Host "icon fetch attempt $attempt failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 5
            }
            if (-not $ok) {
              throw "IconUrl $icon did not return 200; the installer would show a placeholder"
            }
            Write-Host "IconUrl OK: $icon"
          }

          Write-Host "repo.json OK"
          Get-Content .\build\repo.json -Raw

      - name: Publish Plugin
        uses: softprops/action-gh-release@v3
        with:
          # Explicit tag_name so a dispatched run creates the tag; on a tag push this matches github.ref.
          tag_name: ${{ env.tag }}
          files: |
            ./build/latest.zip
            ./build/repo.json
          token: ${{ secrets.GITHUB_TOKEN }}
